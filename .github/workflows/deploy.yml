name: Spring Boot CI/CD to EC2

# main 브랜치에 push가 발생할 때마다 실행됨
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 깃허브가 제공하는 가상 서버에서 실행

    steps:
      # 1. 내 깃허브 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. JDK 21 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'corretto'

      # 3. 🔥 보안 파일(Firebase JSON) 생성
      # (빌드 전에 src/main/resources/ 에 만들어둬서 jar 파일에 포함되게 함)
      # deploy.yml의 3번째 스텝을 아래처럼 변경하세요!
      - name: Create Firebase Key File
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.FIREBASE_KEY }}" | base64 --decode > src/main/resources/firebase-key.json

      # 4. 스프링 부트 프로젝트 빌드
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test # 테스트 코드는 생략 (필요하면 -x test 제거)

      # 5. Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/semotone-server:latest # semotone-server 부분은 원하는 이름으로 변경

      # 7. EC2에 접속해서 배포 실행 (SSH)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # EC2 안에 .env 파일 생성 (깃허브 시크릿에서 가져옴)
            echo "${{ secrets.ENV_FILE }}" > /home/ubuntu/.env
            
            # 최신 도커 이미지 다운로드
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/semotone-server:latest
            
            # 기존에 돌고 있던 컨테이너 종료 및 삭제
            sudo docker stop semotone-server || true
            sudo docker rm semotone-server || true
            
            # 새 컨테이너 실행 (.env 파일 적용 및 8080 포트 연결)
            sudo docker run -d \
              --name semotone-server \
              --env-file /home/ubuntu/.env \
              -p 8080:8080 \
              ${{ secrets.DOCKERHUB_USERNAME }}/semotone-server:latest
            
            # 사용하지 않는 쓰레기 도커 이미지 삭제 (EC2 용량 확보)
            sudo docker image prune -f